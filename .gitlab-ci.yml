# # Official language image. Look for the different tagged releases at:
# # https://hub.docker.com/r/library/python/tags/
# # Une fois deployé, gitlab se place dans le projet :
# /builds/desr-sires-pga/support_n1/Outils
# https://sonar.meteo.fr/tutorials?id=outils
# https://gitlab.meteo.fr/help/ci/yaml/_index.md

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ### BN 2025-07-18 invalidation configuration du proxy MF pour éviter pb ssl
  #http_proxy: "http://proxy.meteo.fr:11011"
  #https_proxy: "http://proxy.meteo.fr:11011"
  #no_proxy: "http://127.0.0.1,http://localhost"

  #$CI_COMMIT_REF_SLUG = master
  PACKAGE_NAME: ${CI_PROJECT_NAME}
  VERSION: "2.0.2"
  CI_DEBUG_TRACE: "false" # activation mode debug  => true
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

default:
  image: "python:3.12-slim"
  cache:
    - key: cache-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/pip
        - .pyenv
        - envdev
        - public
      policy: pull-push
  artifacts:
    paths:
      - public

workflow:
  name: $PIPELINE_NAME
  rules:
    - if: $CI_PROJECT_URL =~ "https://github.com/bruschin/listem3u"
      when: never
    - if: $CI_PROJECT_URL =~ "https://gitlab.meteo.fr/desr-sires-pga/support_n1/listem3u"
      when: always

# https://docs.gitlab.com/ee/ci/yaml/yaml_optimization.html
.maj_pip: &maj_pip
  - pip install --upgrade pip --break-system-packages --root-user-action=ignore || true

.apt_get_update: &apt_get_update
  - apt-get update || true

.before_lint: &before_lint
  # image docker par defaut + minimum pour pylint
  - *maj_pip
  - pip install pylint --root-user-action=ignore || true

.before_shellcheck: &before_shellcheck
  # image docker par defaut + minimum pour pylint
  - *apt_get_update
  - apt-get install -y shellcheck || true

.before_ruff: &before_ruff
  # image docker par defaut + minimum pour pylint
  - *maj_pip
  - pip install ruff --root-user-action=ignore || true

.before_tox: &before_tox
  - *maj_pip
  - pip install tox pytest pytest-cov pytest-xdist --root-user-action=ignore || true

.before_documentations: &before_documentations
  # Pour éviter ultérieurement  : debconf: (Can't locate Term/ReadLine.pm ....
  - echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
  - *apt_get_update
  # Pour doxygen : https://askubuntu.com/questions/1291874/how-to-install-doxygen-on-ubuntu
  - apt-get install -y doxygen libxapian30 graphviz dia || true
  # pour sphinx:
  - apt-get install -y python3-sphinx python3-git ca-certificates git curl wget
  # - apt-get install -y rhino lcov || true
  # - apt-get install -y  libncurses-dev python3-sphinx || true
  # - apt-get install -y  python3-sphinx-copybutton sphinx-common
  #     python3-pydata-sphinx-theme python3-alabaster || true
  - set GIT_SSL_NO_VERIFY
  - echo "proxy = http://proxy.meteo.fr:11011" > $HOME/.curlrc
  - echo "insecure" >> $HOME/.curlrc
  - export CURL_CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"
  - update-ca-certificates -f
  - *maj_pip
  - pip install sphinx sphinx-book-theme sphinx-multiversion sphinx_rtd_theme \
      GitPython git --root-user-action=ignore || true
  - pip install -r docs/requirements.txt --root-user-action=ignore || true

.before_build: &before_build
  - *maj_pip
  - python3 -m pip install pylint-common --use-pep517
  - pip install -r docs/requirements.txt --root-user-action=ignore || true

.before_sonarqube-vulnerability-report: &before_sonarqube-vulnerability-report
  - *apt_get_update
  - apt-get install -y ca-certificates curl || true
  - echo "proxy = http://proxy.meteo.fr:11011" > $HOME/.curlrc
  - echo "insecure" >> $HOME/.curlrc

.some-actions-apt-before: &some-actions-apt-before

  # Pour éviter ultérieurement  : debconf: (Can't locate Term/ReadLine.pm ....
  - echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
  - *apt_get_update
  - apt-get upgrade -y || true

  # Pour doxygen : https://askubuntu.com/questions/1291874/how-to-install-doxygen-on-ubuntu
  - apt-get install -y doxygen libxapian30 graphviz dia

  # pour pyenv necessaire pour tox, ruff etc.:
  # https://blog.stephane-robert.info/docs/developper/programmation/python/pyenv/
  - apt-get install -y make build-essential libssl-dev zlib1g-dev 
      libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm 
      libncurses5-dev libncursesw5-dev xz-utils tk-dev libffi-dev
      liblzma-dev python3-openssl

.some_mise_en_forme_before: &some_mise_en_forme_before
  - export NORMALIZED_NAME=$(echo "${CI_PROJECT_NAME}" | tr '-' '_') || true
  - export TXT_RED="\e[31m" && TXT_CLEAR="\e[0m"
  - export TXT_YELLOW="\e[33m"
  - cd "$CI_PROJECT_DIR"
  - |
      if [[ ! -d public ]] ; then
        mkdir public || true
      fi

.gestion_env_python_before: &gestion_env_python_before
  - echo -e "${TXT_RED} Gestion env. virtuel python = envdev ${TXT_CLEAR}"
  - python3 -m venv $HOME/envdev || true
  - source $HOME/envdev/bin/activate || true

  - echo -e "${TXT_RED} Gestion configurations git curl et proxy ${TXT_CLEAR}"
  - *apt_get_update
  - apt-get install -y ca-certificates git curl wget
  - git config --global http.sslVerify false
  - git config --global https.sslVerify false
  - git config --global https.proxy http://proxy.meteo.fr:11011
  - set GIT_SSL_NO_VERIFY
  - echo "proxy = http://proxy.meteo.fr:11011" > $HOME/.curlrc
  - echo "insecure" >> $HOME/.curlrc
  #- echo "cacert=/etc/ssl/certs/ca-certificates.crt" >> $HOME/.curlrc

.gestion_pyenv: &gestion_pyenv
  - echo -e "${TXT_RED} Gestion pyenv ${TXT_CLEAR}"
    # - curl -kfsSL https://pyenv.run | bash || true
  - curl -k -s -S -L https://raw.githubusercontent.com/pyenv/pyenv-installer/master/bin/pyenv-installer | bash || true
  - export PYENV_ROOT="$HOME/.pyenv"
  - export PATH="$PYENV_ROOT/bin:$PATH"
  - eval "$(pyenv init - bash)" || true

  ### docker MF mode installation indirect
  - echo -e "${TXT_RED} Gestion pyenv multiversions python ${TXT_CLEAR}"
  - mkdir -p $HOME/.pyenv/cache/ || true
  - curl -k --output-dir $HOME/.pyenv/cache/ -o Python-3.10.19.tar.xz
      https://www.python.org/ftp/python/3.10.19/Python-3.10.19.tar.xz || true
  - curl -k --output-dir $HOME/.pyenv/cache/ -o Python-3.11.14.tar.xz
      https://www.python.org/ftp/python/3.11.14/Python-3.11.14.tar.xz || true
  - curl -k --output-dir $HOME/.pyenv/cache/ -o Python-3.12.12.tar.xz
      https://www.python.org/ftp/python/3.12.12/Python-3.12.12.tar.xz || true
  - if which pyenv > /dev/null; then eval "$(pyenv init -)"; fi

  - pyenv install 3.10.19 || true
  - pyenv install 3.11.14 || true
  - pyenv install 3.12.12 || true
  - pyenv global 3.10 3.11 3.12 || true

.gestion_pip_nexus: &gestion_pip_nexus

  - echo -e "${TXT_RED} Gestion pip nexus-sidev ${TXT_CLEAR}"
  - pip config set global.trusted-host nexus-sidev.meteo.fr || true
  - pip config set global.index http://nexus-sidev.meteo.fr/repository/pypi-group/pypi || true
  - pip config set global.index-url http://nexus-sidev.meteo.fr/repository/pypi-group/simple || true

.gestion_twine_nexus: &gestion_twine_nexus
  - echo -e "${TXT_RED} Requirements nexus pour twine ${TXT_CLEAR}"
  #- python3 -m pip install --upgrade pip
  - *maj_pip
  - python3 -m pip install pylint-common --use-pep517

.gestion_pip_update: &gestion_pip_update
  - echo -e "${TXT_RED} Requirements python par pip ${TXT_CLEAR}"
  - python3 -m pip install --upgrade pip
  - python3 -m pip install pylint-common --use-pep517
  - pip install -r docs/requirements.txt --root-user-action=ignore || true
  - pip install --upgrade pip --break-system-packages --root-user-action=ignore || true

